[project]
name = "ppsc-paper-bank"
version = "0.1.0"
description = "A FastAPI-based MCQ power bank system"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "apscheduler>=3.10.4",
    "aiomysql>=0.3.2",
    "asgiref>=3.8.1",
    "beautifulsoup4>=4.13.4",
    "cryptography>=3.4.8",
    "fastapi[standard]>=0.115.12",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "lxml>=5.4.0",
    "markdownify>=1.2.2",
    "mcp>=1.23.3",
    "mysql-connector-python>=9.0.0",
    "openai-agents[litellm,sqlalchemy]>=0.6.2",
    "passlib[bcrypt]>=1.7.4",
    "psycopg2-binary>=2.9.10",
    "pymysql>=1.1.1",
    "python-dotenv>=1.1.0",
    "python-jose[cryptography]>=3.3.0",
    "python-multipart>=0.0.22",
    "pyodbc>=5.2.0",
    "requests>=2.32.3",
    "sqlmodel>=0.0.24",
    "uvicorn>=0.34.2",
    "xhtml2pdf>=0.2.17",
    "anthropic>=0.122.0",
    "tavily-python>=0.5.0",
    "ddgs>=7.0.0",
]

[dependency-groups]
dev = [
    "alembic>=1.14.1",
    "httpx>=0.28.1",
    "pytest>=8.3.5",
    "pytest-asyncio>=0.23.5",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
